name = "arithmetic-kakeya-finite-bridges"
version = "0.1.0"
defaultTargets = ["OperatorFirst", "MixedIntake"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[[lean_lib]]
name = "OperatorFirst"
globs = ["OperatorFirst.+"]

[[lean_lib]]
name = "MixedIntake"
globs = ["MixedIntake.+"]
